name: Verify tree zip
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check BoardConfig SELinux setting inside tree.zip
        run: |
          ls -l tree.zip
          echo "--- BoardConfig.mk entries in tree.zip ---"
          unzip -l tree.zip | grep -i "BoardConfig.mk" || echo "(no BoardConfig.mk entry found)"
          echo "--- selinux lines in BoardConfig.mk ---"
          for f in $(unzip -l tree.zip | grep -oE '[^ ]*BoardConfig\.mk'); do echo "== $f =="; unzip -p tree.zip "$f" | grep -i selinux || echo "(no selinux line in $f)"; done
