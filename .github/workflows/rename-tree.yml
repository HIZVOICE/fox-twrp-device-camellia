name: Rename tree zip
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace tree.zip with the 12.1 tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm tree.zip
          git mv tree-12-selinux.zip tree.zip
          git commit -m "OrangeFox 12.1 tree: SELinux enforcing + maintainer HIZVOICE, patch 2"
          git push
